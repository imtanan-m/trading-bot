# ===================================================================
#  Saare bots (sab PAPER mode: nakli paisa, Binance ki asli prices)
#  Naya bot banana ho ya setting badalni ho to Claude ko bolein.
# ===================================================================
fee_pct: 0.10        # Binance spot fee har taraf
slippage_pct: 0.05

bots:
  - id: momentum_ls
    name: "Momentum Long/Short"
    tag: "Upgrade"
    color: "#0ea5e9"
    kind: momls
    timeframe: 1d
    symbols: [BTC/USDT, ETH/USDT, SOL/USDT, XRP/USDT, BNB/USDT, DOGE/USDT, ADA/USDT, LINK/USDT, AVAX/USDT, SUI/USDT]
    capital: 1000
    news_filter: false
    fee_pct: 0.05
    slippage_pct: 0.02
    params: {sma: 50, lookback: 30, n_coins: 10, shorts: true}
    risk: {leverage: 1, funding_pct_8h: 0.01, max_open_positions: 10, min_cash_reserve_pct: 1,
           daily_loss_limit_pct: 100, max_drawdown_kill_pct: 50}
    about: >
      Upgrade bot (futures, 1x, koi leverage nahi): 10 bade coins mein har coin ko 1/10 paisa. Jis coin ka
      trend upar ho (price 50-din average se upar aur 30 din ka return positive) us mein LONG, jis ka
      trend neeche ho us mein SHORT, warna kuch nahi. Is liye girte market mein bhi kama sakta hai.
      Roz ek baar faisla. Backtest (2023-ab): +274%, giraav -37%. Test period +23%/saal, pichhle 90 din +28.5%.

  - id: futures_swing
    name: "Futures Swing 4h"
    tag: "Upgrade"
    color: "#f97316"
    kind: scalp
    timeframe: 4h
    bars: 1800
    symbols: [BTC/USDT, ETH/USDT, SOL/USDT, XRP/USDT, BNB/USDT, DOGE/USDT, ADA/USDT, LINK/USDT, AVAX/USDT, SUI/USDT]
    capital: 1000
    news_filter: false
    fee_pct: 0.05
    slippage_pct: 0.02
    params: {mode: trend, min_votes: 5, tp_atr: 6.0, sl_atr: 3.0, max_bars: 30}
    risk: {leverage: 5, funding_pct_8h: 0.01, risk_per_trade_pct: 0.5, max_position_pct: 100,
           max_open_positions: 5, min_cash_reserve_pct: 1, daily_loss_limit_pct: 6, max_drawdown_kill_pct: 40}
    about: >
      Upgrade bot: wahi 6-angle futures strategy, lekin 4 ghante ke chart pe. Kam trades, is liye kam fees,
      aur har trade ko bada move milta hai. LONG ya SHORT, 5x leverage, har trade mein 0.5% risk, target
      6 ATR, stop 3 ATR, 5 din ki limit. Backtest (2023-ab): +46%, giraav sirf -12%, 8 mein se 8 settings
      profit mein. Haftay mein ~4 trades.

  - id: futures_scalper
    name: "Futures Scalper"
    tag: "Experiment"
    color: "#4d7c0f"
    kind: scalp
    timeframe: 1h
    bars: 2500
    symbols: [BTC/USDT, ETH/USDT, SOL/USDT, XRP/USDT, BNB/USDT, DOGE/USDT]
    capital: 1000
    news_filter: false
    fee_pct: 0.05        # Binance USD-M futures taker fee
    slippage_pct: 0.02
    params: {mode: trend, min_votes: 5, tp_atr: 4.0, sl_atr: 2.0, max_bars: 24}
    risk: {leverage: 5, funding_pct_8h: 0.01, risk_per_trade_pct: 0.5, max_position_pct: 100,
           max_open_positions: 3, min_cash_reserve_pct: 1, daily_loss_limit_pct: 5, max_drawdown_kill_pct: 50}
    about: >
      Futures agent (paper): 6 bade coins pe har ghante LONG ya SHORT dhoondta hai, 5x leverage ke saath.
      Har candle pe 6 angles se vote: EMA 20/50/200, bara trend (EMA-800), MACD, RSI, VWAP aur volume.
      Trend mazboot ho (ADX 25+), kam se kam 5 votes ek taraf hon, aur price breakout kare, tabhi trade.
      Har trade pe stop (2 ATR) aur target (4 ATR). +1R pe stop break-even pe aa jata hai, aur 24 ghante
      ki time limit hai. Har trade mein sirf 0.5% risk. Sach: research mein 54 scalping settings mein se
      koi bhi fees ke baad profit mein nahi thi. Ye sab se kam buri thi (90 din: +20%, poora backtest: -51%).
      Isse asli paise pe na chalayein.

  - id: futures_active
    name: "Futures Active"
    tag: "Active"
    color: "#e11d48"
    kind: scalp
    timeframe: 1h
    bars: 2500
    symbols: [BTC/USDT, ETH/USDT, SOL/USDT, XRP/USDT, BNB/USDT, DOGE/USDT, ADA/USDT, LINK/USDT, AVAX/USDT, SUI/USDT]
    capital: 1000
    news_filter: false
    fee_pct: 0.05
    slippage_pct: 0.02
    params: {mode: trend, min_votes: 4, tp_atr: 4.0, sl_atr: 2.0, max_bars: 24}
    risk: {leverage: 5, funding_pct_8h: 0.01, risk_per_trade_pct: 0.4, max_position_pct: 100,
           max_open_positions: 5, min_cash_reserve_pct: 1, daily_loss_limit_pct: 6, max_drawdown_kill_pct: 60}
    about: >
      Zyada active futures agent (paper): 10 coins pe har ghante LONG/SHORT dhoondta hai, 5x leverage,
      ek waqt mein 5 trades tak. Futures Scalper wali strategy hai, lekin 6 mein se 4 votes kaafi hain,
      is liye roz kai trades leta hai. Har trade mein stop (2 ATR), target (4 ATR), break-even aur 24 ghante
      ki limit. Har trade mein 0.4% risk. Sach: zyada trades = zyada fees. Backtest mein pichhle 90 din +15%,
      lekin 2 saal mein -67%. Ye dikhane ke liye hai ke active trading asal mein kaisi chalti hai.

  - id: hunter_daily
    name: "Opportunity Hunter"
    tag: "High risk"
    color: "#0ea5e9"
    kind: rotation
    timeframe: 1d
    universe: {pool: 100, top: 30}
    btc_filter: true
    capital: 1000
    news_filter: true
    params: {lookback: 14, sma: 20, k: 3}
    risk: {max_open_positions: 3, min_cash_reserve_pct: 1, daily_loss_limit_pct: 100, max_drawdown_kill_pct: 60}
    about: >
      Agent jo Binance ke top 100 coins roz scan karta hai. Us din ke top-30 volume wale coins mein se
      jo 3 sab se mazboot trend mein hon (14 din ka risk-adjusted return), unhein khareedta hai, aur
      trend tootne pe bech ke agla behtar coin le leta hai. Sirf tab khareedta hai jab BTC khud apne
      50-din average se upar ho (BTC filter). Backtest: +47%/saal, lekin giraav -54% tak. Bohot risky.

  - id: dip_catcher
    name: "Dip Catcher"
    tag: "Profit-booking"
    color: "#14b8a6"
    kind: dip
    timeframe: 1d
    universe: {pool: 100, top: 30}
    btc_filter: true
    capital: 1000
    news_filter: true
    params: {rsi_buy: 25, take_profit_pct: 0.12, stop_pct: 0.08, max_bars: 10, k: 3}
    risk: {max_open_positions: 3, min_cash_reserve_pct: 1, daily_loss_limit_pct: 100, max_drawdown_kill_pct: 40}
    about: >
      Agent jo top coins mein se sab se zyada gire hue (oversold, RSI-14 25 se neeche) coin dhoondta hai
      aur khareedta hai. +12% pe profit book, -8% pe stop-loss, ya 10 din baad bech deta hai. Har trade
      ka anjaam pehle se tay hai. Backtest: +13%/saal, giraav -28%, aadhi se zyada trades jeet.
      Upgrade (21 Nov): ab sirf tab khareedta hai jab BTC apne 50-din average se upar ho. Girte market mein
      dip khareedna nuqsan de raha tha (backtest: is filter ke saath giraav -27% se ghat ke -6% raha).

  - id: momentum_daily
    name: "Momentum Daily"
    tag: "Growth"
    color: "#4f8cff"
    kind: momentum
    timeframe: 1d
    symbols: [BTC/USDT, ETH/USDT, SOL/USDT]
    capital: 1000
    news_filter: true
    params: {sma: 50, lookback: 30, n_coins: 3}
    risk: {max_open_positions: 3, min_cash_reserve_pct: 1, daily_loss_limit_pct: 100, max_drawdown_kill_pct: 45}
    about: >
      Roz ek baar (daily candle) dekhta hai. Coin ka 50 din ka average aur 30 din ka return dono
      upar hon to coin rakhta hai, warna bech deta hai. Har coin ko 1/3 paisa. Backtest mein sab se
      zyada profit, lekin giraav bhi bara (-36% tak). Trades kam aur lambi hoti hain (hafton ki).

  - id: trend_4h
    name: "Trend Rider 4h"
    tag: "Safe"
    color: "#22c55e"
    kind: trend
    timeframe: 4h
    symbols: [BTC/USDT, ETH/USDT]
    capital: 1000
    news_filter: true
    params: {ema_fast: 50, ema_slow: 200, breakout_lookback: 20, adx_min: 20, initial_stop_atr: 2.5, trail_stop_atr: 3.5}
    risk: {risk_per_trade_pct: 0.75, max_position_pct: 45, max_open_positions: 2, min_cash_reserve_pct: 5, daily_loss_limit_pct: 3, max_drawdown_kill_pct: 20}
    about: >
      Aap ka pehla bot. Uptrend mein 20 candles ka high toote to khareedta hai, aur har trade pe
      stop-loss lagata hai (sirf 0.75% risk). Profit kam, lekin giraav sab se kam (-15%).

  - id: hold
    name: "Buy & Hold (Benchmark)"
    tag: "Benchmark"
    color: "#a78bfa"
    kind: hold
    timeframe: 1d
    symbols: [BTC/USDT, ETH/USDT, SOL/USDT]
    capital: 1000
    news_filter: false
    params: {n_coins: 3}
    risk: {max_open_positions: 3, min_cash_reserve_pct: 0, daily_loss_limit_pct: 100, max_drawdown_kill_pct: 100}
    about: >
      Muqable ke liye: teeno coins khareed ke rakh liye, kabhi nahi bechte. Agar koi bot is se
      kam kamaye aur giraav bhi zyada ho, to wo bot bekaar hai.
