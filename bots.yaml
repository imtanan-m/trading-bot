# ===================================================================
#  Saare bots (sab PAPER mode: nakli paisa, Binance ki asli prices)
#  Naya bot banana ho ya setting badalni ho to Claude ko bolein.
# ===================================================================
fee_pct: 0.10        # Binance spot fee har taraf
slippage_pct: 0.05

bots:
  - id: hunter_daily
    name: "Opportunity Hunter"
    tag: "High risk"
    color: "#0ea5e9"
    kind: rotation
    timeframe: 1d
    universe: {pool: 100, top: 30}
    btc_filter: true
    capital: 1000
    news_filter: true
    params: {lookback: 14, sma: 20, k: 3}
    risk: {max_open_positions: 3, min_cash_reserve_pct: 1, daily_loss_limit_pct: 100, max_drawdown_kill_pct: 60}
    about: >
      Agent jo Binance ke top 100 coins roz scan karta hai. Us din ke top-30 volume wale coins mein se
      jo 3 sab se mazboot trend mein hon (14 din ka risk-adjusted return), unhein khareedta hai, aur
      trend tootne pe bech ke agla behtar coin le leta hai. Sirf tab khareedta hai jab BTC khud apne
      50-din average se upar ho (BTC filter). Backtest: +47%/saal, lekin giraav -54% tak. Bohot risky.

  - id: dip_catcher
    name: "Dip Catcher"
    tag: "Profit-booking"
    color: "#14b8a6"
    kind: dip
    timeframe: 1d
    universe: {pool: 100, top: 30}
    capital: 1000
    news_filter: true
    params: {rsi_buy: 25, take_profit_pct: 0.12, stop_pct: 0.08, max_bars: 10, k: 3}
    risk: {max_open_positions: 3, min_cash_reserve_pct: 1, daily_loss_limit_pct: 100, max_drawdown_kill_pct: 40}
    about: >
      Agent jo top coins mein se sab se zyada gire hue (oversold, RSI-14 25 se neeche) coin dhoondta hai
      aur khareedta hai. +12% pe profit book, -8% pe stop-loss, ya 10 din baad bech deta hai. Har trade
      ka anjaam pehle se tay hai. Backtest: +13%/saal, giraav -28%, aadhi se zyada trades jeet.
      Girte market mein bhi mauqe dhoondta hai.

  - id: momentum_daily
    name: "Momentum Daily"
    tag: "Growth"
    color: "#4f8cff"
    kind: momentum
    timeframe: 1d
    symbols: [BTC/USDT, ETH/USDT, SOL/USDT]
    capital: 1000
    news_filter: true
    params: {sma: 50, lookback: 30, n_coins: 3}
    risk: {max_open_positions: 3, min_cash_reserve_pct: 1, daily_loss_limit_pct: 100, max_drawdown_kill_pct: 45}
    about: >
      Roz ek baar (daily candle) dekhta hai. Coin ka 50 din ka average aur 30 din ka return dono
      upar hon to coin rakhta hai, warna bech deta hai. Har coin ko 1/3 paisa. Backtest mein sab se
      zyada profit, lekin giraav bhi bara (-36% tak). Trades kam aur lambi hoti hain (hafton ki).

  - id: trend_4h
    name: "Trend Rider 4h"
    tag: "Safe"
    color: "#22c55e"
    kind: trend
    timeframe: 4h
    symbols: [BTC/USDT, ETH/USDT]
    capital: 1000
    news_filter: true
    params: {ema_fast: 50, ema_slow: 200, breakout_lookback: 20, adx_min: 20, initial_stop_atr: 2.5, trail_stop_atr: 3.5}
    risk: {risk_per_trade_pct: 0.75, max_position_pct: 45, max_open_positions: 2, min_cash_reserve_pct: 5, daily_loss_limit_pct: 3, max_drawdown_kill_pct: 20}
    about: >
      Aap ka pehla bot. Uptrend mein 20 candles ka high toote to khareedta hai, aur har trade pe
      stop-loss lagata hai (sirf 0.75% risk). Profit kam, lekin giraav sab se kam (-15%).

  - id: trend_1h
    name: "Trend Rider 1h"
    tag: "Experiment"
    color: "#f59e0b"
    kind: trend
    timeframe: 1h
    symbols: [BTC/USDT, ETH/USDT, SOL/USDT]
    capital: 1000
    news_filter: true
    params: {ema_fast: 100, ema_slow: 400, breakout_lookback: 20, adx_min: 25, initial_stop_atr: 2.5, trail_stop_atr: 5.0}
    risk: {risk_per_trade_pct: 0.75, max_position_pct: 33, max_open_positions: 3, min_cash_reserve_pct: 2, daily_loss_limit_pct: 3, max_drawdown_kill_pct: 25}
    about: >
      Wahi trend strategy, lekin ghante ki candles pe. Trades zyada aur jaldi hoti hain. Backtest mein
      profit kam tha (+5%/saal), kyunke fees zyada lagti hain.

  - id: scalper_1h
    name: "Fast Scalper (Day Trading)"
    tag: "Warning"
    color: "#ef4444"
    kind: rsi2
    timeframe: 1h
    symbols: [BTC/USDT, ETH/USDT, SOL/USDT]
    capital: 1000
    news_filter: false
    params: {ema_trend: 200, rsi_buy: 10, exit_ema: 5, max_bars: 24, stop_atr: 2.0}
    risk: {risk_per_trade_pct: 0.75, max_position_pct: 33, max_open_positions: 3, min_cash_reserve_pct: 2, daily_loss_limit_pct: 100, max_drawdown_kill_pct: 30}
    about: >
      Asli day trading: din mein kai trades, chhoti girawat pe khareed ke uchaal pe bechna. Ye
      bot sirf dikhane ke liye hai ke tez trading mein fees kaise profit kha jaati hain.
      Backtest mein -43%/saal tha. Isse asli paise pe kabhi na chalayein.

  - id: hold
    name: "Buy & Hold (Benchmark)"
    tag: "Benchmark"
    color: "#a78bfa"
    kind: hold
    timeframe: 1d
    symbols: [BTC/USDT, ETH/USDT, SOL/USDT]
    capital: 1000
    news_filter: false
    params: {n_coins: 3}
    risk: {max_open_positions: 3, min_cash_reserve_pct: 0, daily_loss_limit_pct: 100, max_drawdown_kill_pct: 100}
    about: >
      Muqable ke liye: teeno coins khareed ke rakh liye, kabhi nahi bechte. Agar koi bot is se
      kam kamaye aur giraav bhi zyada ho, to wo bot bekaar hai.
