name: Trading bots (paper)

# GitHub's own schedule is unreliable for new repos, so each run keeps the bot going
# for ~5.5 hours (a cycle every 15 min) and then starts the next run itself.
# The hourly schedule below is only a safety net in case that chain ever breaks.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: trading-bots
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Bot loop (every 15 min for ~5.5 h)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOOP_MINUTES: "330"
          INTERVAL: "900"
        run: bash scripts/loop.sh
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref main --repo "$GITHUB_REPOSITORY"
