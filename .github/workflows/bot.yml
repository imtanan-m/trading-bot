name: Trading bots (paper)

on:
  schedule:
    - cron: "*/15 * * * *"     # every 15 minutes (GitHub may delay a few minutes)
  workflow_dispatch: {}         # "Run workflow" button for a manual run

permissions:
  contents: write

concurrency:
  group: trading-bots
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run one bot cycle
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_cycle.py
      - name: Save state + dashboard data
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add state docs/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "bot update $(date -u +'%Y-%m-%d %H:%M')" -q
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
