name: Research (backtest many strategies)

on:
  workflow_dispatch:
    inputs:
      universe_n:
        description: "How many top coins"
        default: "100"

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data
          key: research-data-${{ github.run_id }}
          restore-keys: research-data-
      - name: Backtest
        env:
          UNIVERSE_N: ${{ inputs.universe_n }}
        run: python research/run_research.py | tee research/log.txt
      - name: Save results
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add research/results.json research/log.txt
          git commit -qm "research results $(date -u +'%Y-%m-%d %H:%M')" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 7; done
